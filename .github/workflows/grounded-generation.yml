name: Grounded generation held-out validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/reviewed-evidence-controller']
    paths: ['.github/workflows/grounded-generation.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-grounded-generation]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MOTOMEDIC_TEST_INDEX: build/index
      MOTOMEDIC_EVAL_MANIFEST: reports/grounded_generation/v6/runtime_manifest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted query runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.4.6 sentence-transformers==6.1.0 pypdfium2 Flask==3.1.2 google-cloud-firestore==2.21.0
      - uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Map historical test fixture to immutable hosted index
        run: ln -s index build/index-bge-final
      - name: Software boundaries before provider access
        run: python -m unittest -v cloud.grounded_generation.test_provider cloud.grounded_generation.test_runtime cloud.grounded_generation.test_feedback cloud.grounded_generation.test_context cloud.grounded_generation.test_admission cloud.grounded_generation.test_scope cloud.grounded_generation.test_source_context cloud.grounded_generation.test_fuse_refusal cloud.grounded_generation.test_source_authority cloud.grounded_generation.test_generic_runtime cloud.grounded_generation.test_transitions cloud.grounded_generation.test_verified_qa cloud.grounded_generation.test_open_wiring rider_ui.tests.test_client rider_ui.tests.test_verified_sse rider_ui.tests.test_progress_stream cloud.arm_a.test_composer cloud.arm_a.test_api cloud.arm_a.test_question_wiring cloud.arm_a.test_store test_approved_integration
      - name: Frozen private draft and separate verifier on real retrieval
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
          MOTOMEDIC_GROUNDED_LIVE_AUTHORIZED: '1'
        run: python tools/validate_draft_verify_stream.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-generation-${{ github.run_id }}
          path: |
            build/draft-verify-stream-result.json
            build/draft-verify-stream-report.md
          retention-days: 14
