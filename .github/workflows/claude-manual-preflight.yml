name: Claude full-manual zero-based preflight
on:
  push:
    paths:
      - 'experiments/claude_full_manual/claude_transport.py'
      - '.github/workflows/claude-manual-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source integrity
        run: python experiments/claude_full_manual/verify_conversion.py
      - name: Count tokens and compute operation-based budget without inference
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python experiments/claude_full_manual/claude_transport.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-zero-based-preflight
          path: experiments/claude_full_manual/budget_preflight.json
          if-no-files-found: warn
          retention-days: 14
