name: Convert manual with Microsoft MarkItDown

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/claude_full_manual/convert_manual.py'
      - 'experiments/claude_full_manual/conversion-requirements.txt'
      - '.github/workflows/convert-manual-markitdown.yml'

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/claude_full_manual/conversion-requirements.txt
      - name: Convert immutable manual with physical page markers
        run: python experiments/claude_full_manual/convert_manual.py
      - uses: actions/upload-artifact@v4
        with:
          name: markitdown-full-manual
          path: |
            experiments/claude_full_manual/royal-enfield-himalayan-450-owner-manual.md
            experiments/claude_full_manual/conversion_manifest.json
          if-no-files-found: error
          retention-days: 14
