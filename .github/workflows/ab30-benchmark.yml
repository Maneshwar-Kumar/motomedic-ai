name: Matched A versus B thirty cases
on:
  workflow_dispatch:
  push:
    branches: ['codex/reviewed-evidence-controller']
    paths: ['ab30_benchmark.py', '.github/workflows/ab30-benchmark.yml']
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-ab30]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MOTOMEDIC_TEST_INDEX: build/index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted CPU runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.4.6 sentence-transformers==6.1.0 pypdfium2
      - uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Offline contracts before any provider access
        run: python -m unittest -v test_ab30_benchmark test_architecture_measurement test_architecture_benchmark test_benchmark_pacing test_gemini_provider test_gemini_transport_bytes
      - name: Sixty matched initial turns, at most ninety calls, no retries
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
          MOTOMEDIC_GROUNDED_LIVE_AUTHORIZED: '1'
          MOTOMEDIC_BUDGET_PREFLIGHT_FILE: reports/ab30_v1_budget.json
        run: python ab30_benchmark.py --index build/index --output build/ab30_v1_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab30-${{ github.run_id }}
          path: build/ab30_v1_result.json
          retention-days: 30
