name: Versioned owner manual ingestion
on:
  workflow_dispatch:
    inputs:
      parse_run_id:
        description: Prior run containing a verified Docling parse (optional)
        required: false
        type: string
      embedding_model:
        description: Embedding comparison
        type: choice
        default: miniLM
        options:
          - miniLM
          - bge-m3
permissions:
  contents: read
  actions: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ingest.txt
      - name: Install CPU runtime
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt
      - name: Run regression checks
        run: python -m unittest test_diagnose test_retrieve_evidence test_budget_guard
      - uses: actions/download-artifact@v4
        if: inputs.parse_run_id != ''
        with:
          name: owner-manual-index-${{ inputs.parse_run_id }}
          run-id: ${{ inputs.parse_run_id }}
          github-token: ${{ github.token }}
          path: build/parsed
      - name: Parse, chunk and index immutable source
        env:
          PARSE_RUN_ID: ${{ inputs.parse_run_id }}
          EMBEDDING_CHOICE: ${{ inputs.embedding_model }}
        run: |
          args=(--out build/index)
          if [ -n "$PARSE_RUN_ID" ]; then args+=(--parsed-document build/parsed/docling_document.json); fi
          if [ "$EMBEDDING_CHOICE" = "bge-m3" ]; then args+=(--embedding-model BAAI/bge-m3 --max-tokens 1024 --no-package-model); fi
          python -u online_ingest.py "${args[@]}"
      - name: Save resolved dependency versions
        run: pip freeze > build/index/requirements-resolved.txt
      - name: Prepare cross-encoder and compare retrieval
        run: python -u online_retrieve.py --index build/index --prepare-reranker --evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-manual-index-${{ github.run_id }}
          path: build/index/
          retention-days: 7
          if-no-files-found: error
