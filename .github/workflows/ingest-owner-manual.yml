name: Versioned owner manual ingestion
on:
  workflow_dispatch:
    inputs:
      parse_run_id:
        description: Prior run containing a verified Docling parse (optional)
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - name: Install CPU runtime
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install ingestion dependencies
        run: pip install -r ingest/requirements.txt
      - name: Run regression checks
        run: |
          python -m unittest cloud.budget_guard.test_policy
          cd ingest && python -m unittest test_online_assembly test_conditional_retrieval
      - uses: actions/download-artifact@v4
        if: inputs.parse_run_id != ''
        with:
          name: owner-manual-index-${{ inputs.parse_run_id }}
          run-id: ${{ inputs.parse_run_id }}
          github-token: ${{ github.token }}
          path: build/parsed
      - name: Parse, chunk and index immutable source
        env:
          PARSE_RUN_ID: ${{ inputs.parse_run_id }}
        run: |
          args=(--manifest source/source_manifest.json --out build/index)
          if [ -n "$PARSE_RUN_ID" ]; then args+=(--parsed-document build/parsed/docling_document.json); fi
          args+=(--embedding-model BAAI/bge-m3 --max-tokens 1024 --no-package-model)
          python -u ingest/online_ingest.py "${args[@]}"
      - name: Save resolved dependency versions
        run: pip freeze > build/index/requirements-resolved.txt
      - name: Prepare cross-encoder and compare retrieval
        run: python -u ingest/online_retrieve.py --index build/index --prepare-reranker --evaluate
      - name: Verify assembled typed evidence
        env:
          MOTOMEDIC_TEST_INDEX: ${{ github.workspace }}/build/index
        working-directory: ingest
        run: python -m unittest test_online_assembly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-manual-index-${{ github.run_id }}
          path: build/index/
          retention-days: 7
          if-no-files-found: error
