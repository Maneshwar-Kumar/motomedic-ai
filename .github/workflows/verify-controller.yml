name: Verify reviewed evidence controller
on:
  workflow_dispatch:
    inputs:
      response_probe:
        description: One synthetic Gemma26B response-structure diagnostic
        type: boolean
        default: false
      gemma_model:
        description: Explicit owner-authorized comparison model; no automatic fallback
        type: choice
        options:
          - gemma-4-31b-it
          - gemma-4-26b-a4b-it
        default: gemma-4-31b-it
      provider_probe:
        description: Two synthetic request-format controls, no grounding claim
        type: boolean
        default: false
      approved_live:
        description: Run the exact approved text slice with at most four provider requests
        type: boolean
        default: false
  push:
    paths:
      - 'controller_contracts.py'
      - 'evidence_registry.py'
      - 'reviewed_controller.py'
      - 'reviewed_cache.py'
      - 'session_store.py'
      - 'registry_workflow.py'
      - 'registry_source_candidates.py'
      - 'verify_controller.py'
      - 'test_reviewed_controller.py'
      - 'generation_contracts.py'
      - 'generation_providers.py'
      - 'gemini_transport.py'
      - 'test_gemini_provider.py'
      - 'reconcile_accepted_examples.py'
      - 'test_accepted_reconciliation.py'
      - 'verify_gemma_grounding.py'
      - 'constrained_generator.py'
      - 'test_constrained_generator.py'
      - 'verify_generation.py'
      - 'registry/**'
      - 'source_manifest.json'
      - 'online_retrieve.py'
      - 'diagnose.py'
      - '.github/workflows/verify-controller.yml'
permissions:
  contents: read
  actions: read
jobs:
  response_structure:
    if: github.event_name == 'workflow_dispatch' && inputs.response_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One response-structure control, no automatic retry
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
          MOTOMEDIC_GROUNDED_LIVE_AUTHORIZED: '1'
          MOTOMEDIC_BUDGET_PREFLIGHT_FILE: reports/grounded_budget_preflight_26b_v2.json
        run: python provider_response_probe.py --output build/provider_response_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-response-probe-${{ github.run_id }}
          path: build/provider_response_probe.json
          retention-days: 7
  provider_shape:
    if: github.event_name == 'workflow_dispatch' && inputs.provider_probe && !inputs.response_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Two synthetic controls, no automatic retry or model substitution
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
          MOTOMEDIC_GROUNDED_LIVE_AUTHORIZED: '1'
          MOTOMEDIC_BUDGET_PREFLIGHT_FILE: reports/grounded_budget_preflight_v2.json
        run: python provider_shape_probe.py --output build/provider_shape_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-shape-probe-${{ github.run_id }}
          path: build/provider_shape_probe.json
          retention-days: 7
  approved_text:
    if: github.event_name == 'workflow_dispatch' && inputs.approved_live && !inputs.provider_probe && !inputs.response_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MOTOMEDIC_TEST_INDEX: build/index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU query runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy sentence-transformers==6.1.0 pypdfium2
      - name: Reuse immutable hosted BGE snapshot
        uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Verify approval integration and persistence before provider access
        run: |
          python verify_approved_integration.py
          python -m unittest -v test_text_journeys test_gemini_provider test_gemini_transport_bytes
          python human_review/grounding_refinement/case_suite.py --approved --output build/approved_simulated.json
      - name: Two grounded composer and verifier pairs, zero retries
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
          MOTOMEDIC_GROUNDED_LIVE_AUTHORIZED: '1'
          MOTOMEDIC_BUDGET_PREFLIGHT_FILE: reports/grounded_budget_preflight_26b_v3.json
          MOTOMEDIC_GEMMA_COMPARISON_MODEL: ${{ inputs.gemma_model }}
        run: python human_review/grounding_refinement/case_suite.py --approved --live --model "$MOTOMEDIC_GEMMA_COMPARISON_MODEL" --output build/approved_live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-text-journeys-${{ github.run_id }}
          path: |
            reports/approved_integration_exit_v1.json
            build/approved_simulated.json
            build/approved_live.json
          retention-days: 7
  verify:
    if: github.event_name != 'workflow_dispatch' || (!inputs.approved_live && !inputs.provider_probe && !inputs.response_probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only the verification runtime
        run: pip install numpy pypdfium2
      - name: Reuse immutable hosted BGE snapshot
        uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Author draft candidates online from existing evidence objects
        run: python registry_workflow.py propose --index build/index --registry build/proposed-registry
      - name: Verify versioned draft registry
        run: python registry_workflow.py validate --index build/index
      - name: Run state, retrieval and budget regressions
        env:
          MOTOMEDIC_TEST_INDEX: build/index
        run: python -m unittest -v test_constrained_generator test_reviewed_controller test_diagnose test_retrieve_evidence test_budget_guard test_online_assembly test_conditional_retrieval test_gemini_provider test_accepted_reconciliation
      - name: Run five direct and three multi-turn draft gates
        run: python verify_controller.py --index build/index --output build/controller-verification.json
      - name: Verify constrained generation and output validation without paid calls
        run: python verify_generation.py --index build/index --output build/generation-engineering-evaluation.json
      - name: Verify eleven accepted examples with Gemma source gates closed
        run: python verify_gemma_grounding.py --index build/index --output build/gemma-grounding-gates.json
      - name: Export engineering-only review packet
        run: python registry_workflow.py packet --index build/index --kind step --id lookup_oil_grade --output build/review-packet.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-controller-verification-${{ github.run_id }}
          path: |
            build/controller-verification.json
            build/generation-engineering-evaluation.json
            build/gemma-grounding-gates.json
            build/review-packet.json
            build/proposed-registry/*.json
          retention-days: 7
          if-no-files-found: error
