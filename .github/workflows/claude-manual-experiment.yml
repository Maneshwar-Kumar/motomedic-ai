name: Claude cached full-manual eight-case experiment
on:
  push:
    paths:
      - 'experiments/claude_full_manual/run_experiment.py'
      - '.github/workflows/claude-manual-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact manual conversion
        run: python experiments/claude_full_manual/verify_conversion.py
      - name: Test offline experiment boundaries
        run: python -m unittest discover -s experiments/claude_full_manual -p 'test_*.py' -v
      - name: Count exact planned inputs then run bounded arms
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: python experiments/claude_full_manual/run_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-eight-case-experiment
          path: |
            experiments/claude_full_manual/budget_preflight.json
            experiments/claude_full_manual/experiment_results.json
            experiments/claude_full_manual/request_ledger.json
          if-no-files-found: warn
          retention-days: 14
