name: Provision the managed Anthropic key secret
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  provision:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/279945185781/locations/global/workloadIdentityPools/motomedic-public-release/providers/github-secret-publisher
          service_account: motomedic-gh-evaluator@motomedic-ai-20261009.iam.gserviceaccount.com
      - name: Install managed authentication only
        run: python -m pip install google-auth==2.40.3 requests==2.32.5
      - name: Copy the repository Anthropic key into the exact managed secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/provision_evaluator_secret_hosted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-evaluator-secret-${{ github.run_id }}
          path: build/public-evaluator-secret-receipt.json
          retention-days: 14
          if-no-files-found: warn
