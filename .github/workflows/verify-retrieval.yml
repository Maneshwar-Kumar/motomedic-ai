name: Verify retrieval policy and TRD
on:
  workflow_dispatch:
  push:
    paths:
      - online_retrieve.py
      - retrieval_policy.py
      - test_conditional_retrieval.py
      - test_online_assembly.py
      - 03_TRD.docx
      - 03_TRD_Architecture_Decision_Note.docx
      - tools/render_docx.py
      - .github/workflows/verify-retrieval.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification runtime
        run: pip install numpy pypdfium2 pdf2image
      - name: Download immutable hosted BGE index
        uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Run controller and retrieval regression checks
        env:
          MOTOMEDIC_TEST_INDEX: build/index
        run: python -m unittest -v test_diagnose test_retrieve_evidence test_budget_guard test_online_assembly test_conditional_retrieval
      - name: Install hosted document rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation
      - name: Render updated TRD with the packaged document renderer
        run: |
          python tools/render_docx.py 03_TRD.docx --output_dir build/trd-render --emit_pdf
          python tools/render_docx.py 03_TRD_Architecture_Decision_Note.docx --output_dir build/note-render --emit_pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-policy-verification-${{ github.run_id }}
          path: |
            build/trd-render/
            build/note-render/
          retention-days: 7
          if-no-files-found: warn
