name: Exact A post facto semantic audit
on:
  workflow_dispatch:
  push:
    branches: [codex/reviewed-evidence-controller]
    paths: [.github/workflows/a-semantic-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-a-semantic-audit]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse immutable evidence snapshot; no model or ingestion
        uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Offline strict audit classification checks
        run: python -m unittest -v test_a_semantic_audit test_gemini_provider test_gemini_transport_bytes test_benchmark_pacing
      - name: Three verifier-only requests, no retries or fallback
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
          MOTOMEDIC_GROUNDED_LIVE_AUTHORIZED: '1'
          MOTOMEDIC_BUDGET_PREFLIGHT_FILE: reports/a_semantic_audit_v1_budget.json
        run: python audit_a_semantic.py --index build/index --output build/a_semantic_audit_v1_result.json --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-semantic-audit-${{ github.run_id }}
          path: build/a_semantic_audit_v1_result.json
          retention-days: 7
