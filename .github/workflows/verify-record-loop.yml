name: Verify record review loop

on:
  workflow_dispatch:
  push:
    paths:
      - 'human_review/record_workflow/*.py'
      - '.github/workflows/verify-record-loop.yml'
  pull_request:
    paths:
      - 'human_review/record_workflow/*.py'
      - '.github/workflows/verify-record-loop.yml'

permissions:
  contents: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded version and source-binding contracts
        run: python -m unittest discover -s human_review/record_workflow -p 'test_*.py' -v

# Synthetic workflow fixtures only. No model calls, manual upload,
# source approvals, cache changes, deployment or GCP operations.
