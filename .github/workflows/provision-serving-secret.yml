name: Provision private serving provider secret
on:
  workflow_dispatch:
  push:
    branches: ['codex/reviewed-evidence-controller']
    paths: ['.github/workflows/provision-serving-secret.yml']
permissions:
  contents: read
  id-token: write
jobs:
  provision:
    if: github.ref == 'refs/heads/codex/reviewed-evidence-controller' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[provision-serving-key]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/279945185781/locations/global/workloadIdentityPools/motomedic-secret-loader/providers/github
          service_account: motomedic-secret-loader@motomedic-ai-20261009.iam.gserviceaccount.com
      - name: Install secret writer library
        run: pip install google-auth requests
      - name: Write secret using narrowly scoped short-lived identity
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
        run: python tools/provision_serving_secret.py
