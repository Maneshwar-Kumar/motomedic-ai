name: Verify rider UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'rider_ui/**'
      - '.github/workflows/verify-rider-ui.yml'
  pull_request:
    paths:
      - 'rider_ui/**'
      - '.github/workflows/verify-rider-ui.yml'
permissions:
  contents: read
jobs:
  ui-contract-and-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r rider_ui/requirements.txt
      - name: Check UI and fail-closed API boundary
        run: python -m unittest discover -s rider_ui/tests -p 'test_*.py' -v
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'

      - name: Build isolated UI container
        run: docker build -f rider_ui/Dockerfile -t motomedic-rider-ui:ci .
