name: Gemma26B architecture comparison
on:
  workflow_dispatch:
  push:
    branches: ['codex/reviewed-evidence-controller']
    paths:
      - 'architecture_benchmark.py'
      - 'benchmark_stream_transport.py'
      - '.github/workflows/architecture-benchmark.yml'
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    if: github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-architecture-benchmark]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MOTOMEDIC_TEST_INDEX: build/index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU query runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy sentence-transformers==6.1.0 pypdfium2
      - name: Reuse immutable hosted BGE snapshot
        uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Verify experimental contracts before provider access
        run: python -m unittest -v test_architecture_benchmark test_benchmark_pacing test_gemini_provider test_gemini_transport_bytes
      - name: Nine bounded grounded architecture samples, shared pacing and at most two retries
        env:
          MOTOMEDIC_GEMINI_API_KEY: ${{ secrets.MOTOMEDIC_GEMINI_API_KEY }}
          MOTOMEDIC_GROUNDED_LIVE_AUTHORIZED: '1'
          MOTOMEDIC_BUDGET_PREFLIGHT_FILE: reports/architecture_budget_preflight_v3.json
        run: python architecture_benchmark.py --index build/index --output build/architecture_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemma26b-architecture-${{ github.run_id }}
          path: build/architecture_comparison.json
          retention-days: 7
