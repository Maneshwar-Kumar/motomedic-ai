name: Grounded cache and streaming contracts
on:
  workflow_dispatch:
  push:
    branches: ['codex/reviewed-evidence-controller']
    paths:
      - 'online_retrieve.py'
      - 'semantic_candidate_cache.py'
      - 'verified_delivery_stream.py'
      - 'test_architecture_features.py'
      - '.github/workflows/architecture-feature-contracts.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTOMEDIC_TEST_INDEX: build/index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: pip install numpy pypdfium2
      - name: Reuse immutable hosted evidence snapshot
        uses: actions/download-artifact@v4
        with:
          name: owner-manual-index-37908240500
          run-id: '37908240500'
          github-token: ${{ github.token }}
          path: build/index
      - name: Validate source bindings, retrieval, cache, streaming and provider contracts without provider access
        run: |
          python -m unittest -v test_architecture_features test_architecture_benchmark test_conditional_retrieval test_benchmark_pacing test_gemini_provider test_gemini_transport_bytes > build/feature_contracts.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-feature-contracts-${{ github.run_id }}
          path: build/feature_contracts.log
          retention-days: 7
