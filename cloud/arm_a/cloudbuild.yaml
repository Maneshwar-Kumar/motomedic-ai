# This historical path remains in the exact serving inventory. Release builds
# use the canonical cloudbuild.json generated by tools/serving_release.py in
# each prepared context. Submitting the raw repository would omit its installed
# release lock and its generation-pinned source archive, so refuse it explicitly.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - 'echo "Use the frozen prepared context and its generated cloudbuild.json." >&2; exit 1'
